<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
      overflow: hidden;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      background: #f5f5f5;
      border-bottom: 1px solid #ddd;
      height: 36px;
      box-sizing: border-box;
    }

    .tool-btn {
      padding: 4px 12px;
      border-radius: 4px;
      border: 2px solid #2962FF;
      background: white;
      color: #2962FF;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .tool-btn.active {
      background: #2962FF;
      color: white;
    }
    #measureBtn {
      border-color: #e67e00;
      color: #e67e00;
    }
    #measureBtn.active {
      background: #e67e00;
      color: white;
      border-color: #e67e00;
    }
    #clearMeasureBtn {
      border-color: #999;
      color: #999;
      display: none;
    }
    #clearMeasureBtn.visible {
      display: inline-block;
    }

    #toolHint {
      color: #999;
      font-size: 11px;
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    #chart {
      width: 100%;
      touch-action: pan-x pan-y pinch-zoom;
    }
    #chart.draw-mode {
      touch-action: none;
    }
    #chart.measure-mode {
      touch-action: none;
      cursor: crosshair !important;
    }

    #priceTooltip {
      position: fixed;
      background: #2962FF;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      display: none;
      z-index: 9999;
      white-space: nowrap;
    }

    #measurePopup {
      position: absolute;
      pointer-events: none;
      display: none;
      z-index: 9998;
      transform: translate(-50%, -100%);
      margin-top: -8px;
    }
    #measurePopup .bubble {
      background: rgba(230, 126, 0, 0.92);
      color: white;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      line-height: 1.6;
      text-align: center;
    }
    #measurePopup .bubble::after {
      content: "";
      display: block;
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-top: 7px solid rgba(230, 126, 0, 0.92);
      margin: 0 auto;
    }
  </style>
</head>
<body>

<div id="toolbar">
  <button id="drawBtn"         class="tool-btn" onclick="toggleDrawMode()">&#9999;&#65039; 지지선</button>
  <button id="measureBtn"      class="tool-btn" onclick="toggleMeasureMode()">&#128207; 가격 폭</button>
  <button id="clearMeasureBtn" class="tool-btn" onclick="clearMeasure()">&#10005; 폭 지우기</button>
  <span   id="toolHint">모드를 선택하세요</span>
</div>

<div id="chart"></div>
<div id="priceTooltip"></div>
<div id="measurePopup"><div class="bubble" id="measureBubbleText"></div></div>

<script>
  const data          = __CANDLE_DATA__;
  const supportInit   = __SUPPORT_LINES__;
  const markers       = __MARKER_DATA__;
  const fitContent    = __FIT_CONTENT__;
  const autoStopPrice = __AUTO_STOP_PRICE__;
  const entryPrice    = __ENTRY_PRICE__;

  if (typeof LightweightCharts === "undefined") {
    document.body.innerHTML = "<h2>LightweightCharts 로딩 실패</h2>";
  } else {

    const TOOLBAR_H = 36;
    const chartEl   = document.getElementById("chart");
    chartEl.style.height = (window.innerHeight - TOOLBAR_H) + "px";

    const chart = LightweightCharts.createChart(chartEl, {
      layout: { background: { color: "#ffffff" } },
      grid: {
        vertLines: { visible: false },
        horzLines: { visible: false }
      },
      rightPriceScale: {
        scaleMargins: { top: 0.05, bottom: 0.3 }
      },
      timeScale: {
        visible: false,
        rightOffset: 5
      },
      crosshair: { mode: 0 },
      handleScroll: true,
      handleScale: true
    });

    // 캔들
    const candleSeries = chart.addCandlestickSeries({
      upColor: "#d32f2f",
      downColor: "#1976d2",
      wickUpColor: "#d32f2f",
      wickDownColor: "#1976d2",
      borderVisible: false
    });
    candleSeries.setData(data);
    candleSeries.setMarkers(markers);

    // 볼륨
    const volumeSeries = chart.addHistogramSeries({
      priceFormat: { type: "volume" },
      priceScaleId: "volume",
      overlay: false
    });
    chart.priceScale("volume").applyOptions({
      scaleMargins: { top: 0.75, bottom: 0.02 }
    });
    volumeSeries.setData(
      data.map(d => ({
        time: d.time,
        value: d.volume,
        color: d.close >= d.open ? "#d32f2f" : "#1976d2"
      }))
    );

    // =====================
    // 진입가 수평 실선 (노란색)
    // =====================
    if (entryPrice && entryPrice > 0) {
      const times = data.map(d => d.time);
      const entrySeries = chart.addLineSeries({
        color: "#f0b400",
        lineWidth: 2,
        lineStyle: LightweightCharts.LineStyle.Solid,
        priceLineVisible: false,
        lastValueVisible: true,
        crosshairMarkerVisible: false,
        title: "ENTRY",
      });
      entrySeries.setData(times.map(t => ({ time: t, value: entryPrice })));
    }

    // =====================
    // 자동손절가 수평 점선 (빨간색)
    // =====================
    if (autoStopPrice && autoStopPrice > 0) {
      const times = data.map(d => d.time);
      const autoStopSeries = chart.addLineSeries({
        color: "#e05c5c",
        lineWidth: 2,
        lineStyle: LightweightCharts.LineStyle.Dotted,
        priceLineVisible: false,
        lastValueVisible: true,
        crosshairMarkerVisible: false,
        title: "STOP",
      });
      autoStopSeries.setData(times.map(t => ({ time: t, value: autoStopPrice })));
    }

    // =====================
    // 줌/스크롤 상태 유지
    // =====================
    function saveRange() {
      try {
        const range = chart.timeScale().getVisibleRange();
        if (range) window.parent._chartSavedRange = range;
      } catch(e) {}
    }
    requestAnimationFrame(() => {
      if (fitContent) {
        chart.timeScale().fitContent();
        window.parent._chartSavedRange = null;
      } else {
        try {
          const saved = window.parent._chartSavedRange;
          if (saved) {
            chart.timeScale().setVisibleRange(saved);
          } else {
            chart.timeScale().fitContent();
          }
        } catch(e) {
          chart.timeScale().fitContent();
        }
      }
    });
    chart.timeScale().subscribeVisibleTimeRangeChange(saveRange);

    // =====================
    // 지지선 관리
    // =====================
    let supportLines = [];
    let drawMode     = false;
    let dragging     = null;
    let lastClickT   = 0;

    const tooltip = document.getElementById("priceTooltip");

    function setHint(msg) {
      document.getElementById("toolHint").textContent = msg;
    }

    function toggleDrawMode() {
      if (measureMode) toggleMeasureMode();

      drawMode = !drawMode;
      document.getElementById("drawBtn").classList.toggle("active", drawMode);
      chart.applyOptions({ handleScroll: !drawMode, handleScale: !drawMode });

      if (drawMode) {
        chartEl.classList.add("draw-mode");
        chartEl.classList.remove("measure-mode");
        chartEl.style.cursor = "crosshair";
        setHint("클릭: 추가  |  드래그: 이동  |  더블클릭: 삭제");
      } else {
        chartEl.classList.remove("draw-mode");
        chartEl.style.cursor = "default";
        dragging = null;
        hideTooltip();
        setHint("모드를 선택하세요");
      }
    }

    function addSupportLine(price) {
      const id    = Date.now() + Math.random();
      const times = data.map(d => d.time);
      const series = chart.addLineSeries({
        color: "#2962FF",
        lineWidth: 2,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        priceLineVisible: false,
        lastValueVisible: true,
        crosshairMarkerVisible: false,
        title: "",
      });
      series.setData(times.map(t => ({ time: t, value: price })));
      supportLines.push({ id, price, series });
      syncToStreamlit();
      return id;
    }

    function removeSupportLine(id) {
      const idx = supportLines.findIndex(l => l.id === id);
      if (idx === -1) return;
      chart.removeSeries(supportLines[idx].series);
      supportLines.splice(idx, 1);
      syncToStreamlit();
    }

    function updateSupportLine(id, newPrice) {
      const line = supportLines.find(l => l.id === id);
      if (!line) return;
      line.price = newPrice;
      const times = data.map(d => d.time);
      line.series.setData(times.map(t => ({ time: t, value: newPrice })));
    }

    function clearAllSupportLines() {
      supportLines.forEach(l => chart.removeSeries(l.series));
      supportLines = [];
    }

    clearAllSupportLines();
    supportInit.forEach(s => addSupportLine(s.price));

    function syncToStreamlit() {
      const prices = supportLines.map(l => l.price);
      try {
        const url = new URL(window.parent.location.href);
        url.searchParams.set("support_all", JSON.stringify(prices));
        window.parent.history.replaceState({}, "", url.toString());
      } catch(e) {}
    }

    // =====================
    // 가격 폭 측정 도구
    // =====================
    let measureMode       = false;
    let measureDragging   = false;
    let measurePriceA     = null;
    let measureLineA      = null;
    let measureLineB      = null;
    let measureStartY     = null;

    const measurePopup      = document.getElementById("measurePopup");
    const measureBubbleText = document.getElementById("measureBubbleText");

    function toggleMeasureMode() {
      if (drawMode) toggleDrawMode();

      measureMode = !measureMode;
      document.getElementById("measureBtn").classList.toggle("active", measureMode);
      chart.applyOptions({ handleScroll: !measureMode, handleScale: !measureMode });

      if (measureMode) {
        chartEl.classList.add("measure-mode");
        chartEl.classList.remove("draw-mode");
        setHint("시작 지점을 누른 채로 드래그 → 손 떼면 확정");
        clearMeasure();
        measureMode = true;
        document.getElementById("measureBtn").classList.add("active");
      } else {
        chartEl.classList.remove("measure-mode");
        chartEl.style.cursor = "default";
        measureDragging = false;
        measurePriceA   = null;
        hideTooltip();
        setHint("모드를 선택하세요");
      }
    }

    function clearMeasure() {
      measurePriceA   = null;
      measureDragging = false;
      if (measureLineA) { chart.removeSeries(measureLineA); measureLineA = null; }
      if (measureLineB) { chart.removeSeries(measureLineB); measureLineB = null; }
      measurePopup.style.display = "none";
      document.getElementById("clearMeasureBtn").classList.remove("visible");
      if (measureMode) setHint("시작 지점을 누른 채로 드래그 → 손 떼면 확정");
    }

    function drawMeasureLine(price, color, dash) {
      const times = data.map(d => d.time);
      const s = chart.addLineSeries({
        color: color,
        lineWidth: 2,
        lineStyle: dash ? LightweightCharts.LineStyle.Dashed : LightweightCharts.LineStyle.Solid,
        priceLineVisible: false,
        lastValueVisible: true,
        crosshairMarkerVisible: false,
        title: price.toFixed(2),
      });
      s.setData(times.map(t => ({ time: t, value: price })));
      return s;
    }

    function updateMeasureLine(series, price) {
      const times = data.map(d => d.time);
      series.setData(times.map(t => ({ time: t, value: price })));
      series.applyOptions({ title: price.toFixed(2) });
    }

    function showMeasurePopup(priceA, priceB, clientX, clientY) {
      const pct    = ((priceB - priceA) / priceA) * 100;
      const absPct = Math.abs(pct);
      const arrow  = pct >= 0 ? "UP" : "DN";
      const sign   = pct >= 0 ? "+" : "";

      measureBubbleText.innerHTML =
        arrow + " " + priceA.toFixed(2) + " to " + priceB.toFixed(2) + "<br>" +
        "<span style='font-size:15px;'>" + sign + pct.toFixed(2) + "% (" + absPct.toFixed(2) + "%)</span>";

      const rect = chartEl.getBoundingClientRect();
      const yA   = candleSeries.priceToCoordinate(priceA);
      const yB   = candleSeries.priceToCoordinate(priceB);
      const midY = (yA !== null && yB !== null) ? (yA + yB) / 2 : (clientY - rect.top);
      const midX = clientX - rect.left;

      measurePopup.style.display = "block";
      measurePopup.style.left    = midX + "px";
      measurePopup.style.top     = (midY - 4) + "px";
    }

    function handleMeasureDown(clientX, clientY) {
      const price = yToPrice(clientY);
      if (!price || price <= 0) return;

      clearMeasure();
      measureMode     = true;
      document.getElementById("measureBtn").classList.add("active");
      chart.applyOptions({ handleScroll: false, handleScale: false });

      measurePriceA   = price;
      measureDragging = true;
      measureStartY   = clientY;

      if (measureLineA) chart.removeSeries(measureLineA);
      measureLineA = drawMeasureLine(price, "#e67e00", false);

      setHint("드래그 중... 손을 떼면 확정");
    }

    function handleMeasureMove(clientX, clientY) {
      if (!measureDragging || measurePriceA === null) return;

      const price = yToPrice(clientY);
      if (!price || price <= 0) return;

      if (measureLineB) {
        updateMeasureLine(measureLineB, price);
      } else {
        measureLineB = drawMeasureLine(price, "#e67e00", true);
      }

      showMeasurePopup(measurePriceA, price, clientX, clientY);
    }

    function handleMeasureUp(clientX, clientY) {
      if (!measureDragging || measurePriceA === null) return;

      const price = yToPrice(clientY);
      measureDragging = false;

      if (!price || price <= 0 || Math.abs(price - measurePriceA) < 0.01) {
        clearMeasure();
        setHint("시작 지점을 누른 채로 드래그 → 손 떼면 확정");
        return;
      }

      if (measureLineB) {
        updateMeasureLine(measureLineB, price);
      } else {
        measureLineB = drawMeasureLine(price, "#e67e00", true);
      }

      showMeasurePopup(measurePriceA, price, clientX, clientY);
      document.getElementById("clearMeasureBtn").classList.add("visible");
      setHint("드래그로 재측정  |  X 로 지우기");

      measurePriceA = null;
    }

    // =====================
    // 좌표 변환 유틸
    // =====================
    function yToPrice(clientY) {
      const rect = chartEl.getBoundingClientRect();
      return candleSeries.coordinateToPrice(clientY - rect.top);
    }

    function getClientPos(e) {
      if (e.touches && e.touches.length > 0)
        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      if (e.changedTouches && e.changedTouches.length > 0)
        return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }

    function findNearLine(clientY, tolerance) {
      tolerance = tolerance || 8;
      const rect = chartEl.getBoundingClientRect();
      let best = null, bestDist = 9999;
      for (const line of supportLines) {
        const lineY = candleSeries.priceToCoordinate(line.price);
        if (lineY === null) continue;
        const dist = Math.abs(clientY - (rect.top + lineY));
        if (dist <= tolerance && dist < bestDist) {
          best = line;
          bestDist = dist;
        }
      }
      return best;
    }

    // =====================
    // 공통 포인터 핸들러
    // =====================
    function handlePointerDown(e, isTouch) {
      const pos = getClientPos(e);

      if (measureMode) {
        handleMeasureDown(pos.x, pos.y);
        e.preventDefault();
        e.stopPropagation();
        return;
      }

      if (!drawMode) return;

      const now  = Date.now();
      const near = findNearLine(pos.y, isTouch ? 16 : 8);

      if (now - lastClickT < 300 && near) {
        removeSupportLine(near.id);
        hideTooltip();
        lastClickT = 0;
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      lastClickT = now;

      if (near) {
        dragging = { id: near.id };
        chartEl.style.cursor = "ns-resize";
        e.preventDefault();
        e.stopPropagation();
        return;
      }

      const price = yToPrice(pos.y);
      if (price && price > 0) addSupportLine(price);
      e.preventDefault();
      e.stopPropagation();
    }

    function handlePointerMove(e, isTouch) {
      const pos = getClientPos(e);

      if (measureMode) {
        handleMeasureMove(pos.x, pos.y);
        if (e.cancelable) { e.preventDefault(); e.stopPropagation(); }
        return;
      }

      if (!drawMode) return;

      if (dragging) {
        const price = yToPrice(pos.y);
        if (price && price > 0) {
          updateSupportLine(dragging.id, price);
          showTooltip(pos.x, pos.y, price.toFixed(2));
        }
        e.preventDefault();
        e.stopPropagation();
        return;
      }

      if (!isTouch) {
        const near = findNearLine(pos.y, 8);
        if (near) {
          chartEl.style.cursor = "ns-resize";
          showTooltip(pos.x, pos.y, near.price.toFixed(2));
        } else {
          chartEl.style.cursor = "crosshair";
          hideTooltip();
        }
      }
    }

    function handlePointerUp(e, isTouch) {
      const pos = getClientPos(e);

      if (measureMode) {
        handleMeasureUp(pos.x, pos.y);
        e.preventDefault();
        e.stopPropagation();
        return;
      }

      if (!drawMode) return;
      if (dragging) {
        syncToStreamlit();
        dragging = null;
        chartEl.style.cursor = "crosshair";
        hideTooltip();
        e.preventDefault();
        e.stopPropagation();
      }
    }

    // =====================
    // 마우스 이벤트
    // =====================
    chartEl.addEventListener("mousedown",  (e) => handlePointerDown(e, false));
    chartEl.addEventListener("mousemove",  (e) => handlePointerMove(e, false));
    chartEl.addEventListener("mouseup",    (e) => handlePointerUp(e, false));
    chartEl.addEventListener("mouseleave", () => {
      if (measureMode && measureDragging) {
        measureDragging = false;
        measurePriceA   = null;
        setHint("시작 지점을 누른 채로 드래그 → 손 떼면 확정");
      }
      if (dragging) { syncToStreamlit(); dragging = null; }
      hideTooltip();
    });

    // =====================
    // 터치 이벤트
    // =====================
    chartEl.addEventListener("touchstart", (e) => {
      if (e.touches.length >= 2) { dragging = null; return; }
      handlePointerDown(e, true);
    }, { passive: false });

    chartEl.addEventListener("touchmove", (e) => {
      if (e.touches.length >= 2) return;
      handlePointerMove(e, true);
    }, { passive: false });

    chartEl.addEventListener("touchend", (e) => {
      handlePointerUp(e, true);
    }, { passive: false });

    chartEl.addEventListener("touchcancel", () => {
      if (measureMode && measureDragging) {
        measureDragging = false;
        measurePriceA   = null;
      }
      if (dragging) { syncToStreamlit(); dragging = null; }
      hideTooltip();
    });

    // =====================
    // 툴팁
    // =====================
    function showTooltip(x, y, text) {
      tooltip.style.display = "block";
      tooltip.style.left    = (x + 14) + "px";
      tooltip.style.top     = (y - 10) + "px";
      tooltip.textContent   = text;
    }
    function hideTooltip() {
      tooltip.style.display = "none";
    }

    // =====================
    // 리사이즈
    // =====================
    window.addEventListener("resize", () => {
      const h = window.innerHeight - TOOLBAR_H;
      chartEl.style.height = h + "px";
      chart.applyOptions({ width: chartEl.clientWidth, height: h });
    });

  } // end LightweightCharts check
</script>
</body>
</html>
